name: Apply scheduler patch

on:
  push:
    branches:
      - fix/issue-2-scheduler-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-2-scheduler-contract
      - name: Apply exact scheduler changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "config/workflows.yaml",
              '''scheduling:
            enabled: false
            timezone: Asia/Tokyo
            metadata_log: ComfyUI/logs/automation_schedule.jsonl
            waiting_log_interval_seconds: 300
          ''',
              '''scheduling:
            enabled: true
            timezone: Asia/Tokyo
            metadata_log: ComfyUI/logs/automation_schedule.jsonl
            waiting_log_interval_seconds: 0
          ''',
          )

          replace_once(
              "automation/core.py",
              '''    delay = (window_start - now).total_seconds()
              if delay > 0:
                  if WAIT_INTERVAL > 0:
                      remaining = delay
                      while remaining > WAIT_INTERVAL:
                          await asyncio.sleep(WAIT_INTERVAL)
                          remaining -= WAIT_INTERVAL
                          _write_schedule_log(
                              {
                                  "event": "awaiting_window",
                                  "mode": mode,
                                  "preset": preset,
                                  "prompt_digest": digest,
                                  "window_start_local": window_start.isoformat(timespec="seconds"),
                                  "window_start_utc": _utc_stamp(window_start),
                                  "words": words,
                                  "time_remaining_seconds": round(remaining, 2),
                                  "schedule_mode": schedule_mode,
                                  "prompt": prompt,
                                  "parameters": parameters,
                              }
                          )
                          await asyncio.sleep(remaining)
                      else:
                          await asyncio.sleep(delay)
          ''',
              '''    delay = (window_start - now).total_seconds()
              if delay > 0:
                  remaining = delay
                  if WAIT_INTERVAL > 0:
                      while remaining > WAIT_INTERVAL:
                          await asyncio.sleep(WAIT_INTERVAL)
                          remaining -= WAIT_INTERVAL
                          _write_schedule_log(
                              {
                                  "event": "awaiting_window",
                                  "mode": mode,
                                  "preset": preset,
                                  "prompt_digest": digest,
                                  "window_start_local": window_start.isoformat(timespec="seconds"),
                                  "window_start_utc": _utc_stamp(window_start),
                                  "words": words,
                                  "time_remaining_seconds": round(remaining, 2),
                                  "schedule_mode": schedule_mode,
                                  "prompt": prompt,
                                  "parameters": parameters,
                              }
                          )
                  if remaining > 0:
                      await asyncio.sleep(remaining)
          ''',
          )

          replace_once(
              ".gitignore",
              "# Log files\n*.log\n",
              "# Log files\n*.log\nComfyUI/logs/\n",
          )

          replace_once(
              "README.md",
              "- 複数テンプレートの順次処理\n- 実行設定をYAMLで管理",
              "- 複数テンプレートの順次処理\n- 指定時間帯への予約実行と逐次処理\n- 実行設定をYAMLで管理",
          )

          marker = '''```bash
          uv run python -m automation "wan_default" wan
          ```

          コマンドは1行で実行してください。'''
          insertion = '''```bash
          uv run python -m automation "wan_default" wan
          ```

          通常の動画生成は`config/workflows.yaml`の`scheduling`契約に従います。現在は`Asia/Tokyo`の03:00〜05:00を実行ウィンドウとし、ウィンドウ外では`ComfyUI/logs/automation_schedule.jsonl`へ`scheduled`を先に記録して開始時刻まで待機します。実行開始・完了も同じログへ追記され、`prompt_digest`で予約と実行を対応付けます。

          予約状況だけを確認する場合:

          ```bash
          uv run python -m automation scheduled
          ```

          保留中の予約を運用判断で即時実行する場合:

          ```bash
          uv run python -m automation scheduled --run-now
          ```

          スケジュールを明示的に迂回して即時実行する場合:

          ```bash
          uv run python -m automation "wan_default" wan --no-schedule
          ```

          複数プロンプトは`batch_generate`で1件ずつ完了を待ってから次を投入するため、同一プロセスから並列にGPUジョブを投入しません。

          コマンドは1行で実行してください。'''
          replace_once("README.md", marker, insertion)
          replace_once("README.md", "**README最終監査:** 2026-08-01", "**README最終監査:** 2026-08-13")
          PY
      - name: Commit scheduler implementation
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/core.py config/workflows.yaml .gitignore README.md
          git commit -m "fix: enforce nightly scheduler window"
          git push origin HEAD:fix/issue-2-scheduler-contract
