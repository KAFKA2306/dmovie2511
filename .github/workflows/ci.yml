name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install lightweight contract dependencies
        run: python -m pip install --disable-pip-version-check ruff PyYAML httpx websockets
      - name: Unit contracts
        run: python -m unittest discover -s tests -v
      - name: Ruff correctness checks
        run: ruff check automation --output-format=github
      - name: Compile automation
        run: python -m compileall -q automation
