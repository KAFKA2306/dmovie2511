name: Normalize scheduler job id patch

on:
  push:
    branches:
      - fix/issue-2-job-id-correlation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-2-job-id-correlation
      - name: Match job id indentation to correlation field
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("automation/core.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          changed = 0
          seen = 0
          for index, line in enumerate(lines):
              if line.strip() != '"job_id": job_id,':
                  continue
              seen += 1
              if index == 0 or lines[index - 1].strip() != '"prompt_digest": digest,':
                  continue
              previous = lines[index - 1]
              indent = previous[: len(previous) - len(previous.lstrip())]
              replacement = f'{indent}"job_id": job_id,\n'
              if line != replacement:
                  lines[index] = replacement
                  changed += 1
          if seen != 11:
              raise SystemExit(f"expected 11 job_id log fields, found {seen}")
          if changed == 0:
              raise SystemExit("no indentation changes were necessary")
          path.write_text("".join(lines), encoding="utf-8")
          print(f"normalized {changed} fields")
          PY
      - name: Commit formatting normalization
        run: |
          git diff --check
          python -m compileall -q automation/core.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/core.py
          git commit -m "style: normalize scheduler job id fields"
          git push origin HEAD:fix/issue-2-job-id-correlation
