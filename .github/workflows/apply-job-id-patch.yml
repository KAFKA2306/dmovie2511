name: Apply scheduler job id patch

on:
  push:
    branches:
      - fix/issue-2-job-id-correlation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-2-job-id-correlation
      - name: Apply exact job correlation changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("automation/core.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new)

          replace_once(
              "from pathlib import Path\nfrom typing import Any, Dict, Sequence\n",
              "from pathlib import Path\nfrom typing import Any, Dict, Sequence\nfrom uuid import uuid4\n",
          )
          replace_once(
              "    digest: str,\n    words: int,\n",
              "    digest: str,\n    job_id: str,\n    words: int,\n",
          )

          align_start = text.index("async def _align_to_window(")
          align_end = text.index("class ComfyUIClient:", align_start)
          align = text[align_start:align_end]
          expected_align = align.count('"prompt_digest": digest,\n')
          if expected_align != 4:
              raise SystemExit(f"expected 4 scheduler digest fields, found {expected_align}")
          align = align.replace(
              '"prompt_digest": digest,\n',
              '"prompt_digest": digest,\n                "job_id": job_id,\n',
          )
          text = text[:align_start] + align + text[align_end:]

          replace_once(
              "    options = dict(kwargs)\n    use_schedule_flag = options.pop(\"use_schedule\", None)\n",
              "    options = dict(kwargs)\n    job_id = options.pop(\"job_id\", None) or uuid4().hex\n    use_schedule_flag = options.pop(\"use_schedule\", None)\n",
          )
          replace_once(
              "            digest,\n            words,\n            used_prompt,\n",
              "            digest,\n            job_id,\n            words,\n            used_prompt,\n",
          )

          generate_start = text.index("async def generate_video(")
          generate_end = text.index("async def generate_templates(", generate_start)
          generate = text[generate_start:generate_end]
          digest_count = generate.count('"prompt_digest": digest,\n')
          if digest_count != 7:
              raise SystemExit(f"expected 7 generate digest fields, found {digest_count}")
          generate = generate.replace(
              '"prompt_digest": digest,\n',
              '"prompt_digest": digest,\n                "job_id": job_id,\n',
          )
          text = text[:generate_start] + generate + text[generate_end:]

          pending_start = text.index("def pending_scheduled_jobs()")
          pending_end = text.index("async def run_scheduled_jobs", pending_start)
          pending = text[pending_start:pending_end]
          old_loop = '''    for entry in entries:
              digest = entry.get("prompt_digest")
              if not digest:
                  continue
              event = entry.get("event")
              if event in {"execution_started", "execution_completed"}:
                  if digest in pending_map:
                      del pending_map[digest]
                  if digest in order:
                      order.remove(digest)
                  continue
              if event == "schedule_immediate":
                  if digest in pending_map:
                      del pending_map[digest]
                  if digest in order:
                      order.remove(digest)
                  continue
              if event in {"scheduled", "awaiting_window", "window_open", "window_active"}:
                  pending_map[digest] = entry
                  if digest not in order:
                      order.append(digest)
          '''
          new_loop = '''    for entry in entries:
              job_key = entry.get("job_id") or entry.get("prompt_digest")
              if not job_key:
                  continue
              event = entry.get("event")
              if event in {"execution_started", "execution_completed"}:
                  if job_key in pending_map:
                      del pending_map[job_key]
                  if job_key in order:
                      order.remove(job_key)
                  continue
              if event == "schedule_immediate":
                  if job_key in pending_map:
                      del pending_map[job_key]
                  if job_key in order:
                      order.remove(job_key)
                  continue
              if event in {"scheduled", "awaiting_window", "window_open", "window_active"}:
                  pending_map[job_key] = entry
                  if job_key not in order:
                      order.append(job_key)
          '''
          if pending.count(old_loop) != 1:
              raise SystemExit("pending scheduler loop did not match exactly")
          pending = pending.replace(old_loop, new_loop)
          text = text[:pending_start] + pending + text[pending_end:]

          replace_once(
              '''        parameters["use_schedule"] = False
                  mode = entry.get("mode", "wan")
          ''',
              '''        parameters["use_schedule"] = False
                  job_id = entry.get("job_id")
                  if job_id:
                      parameters["job_id"] = job_id
                  mode = entry.get("mode", "wan")
          ''',
          )

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit exact patch
        run: |
          git diff --check
          git diff -- automation/core.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/core.py
          git commit -m "fix: correlate scheduler events with unique job ids"
          git push origin HEAD:fix/issue-2-job-id-correlation
