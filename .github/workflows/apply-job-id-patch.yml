name: Normalize scheduler job id patch

on:
  push:
    branches:
      - fix/issue-2-job-id-correlation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-2-job-id-correlation
      - name: Normalize only inserted job id indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("automation/core.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '                "prompt_digest": digest,\n            "job_id": job_id,\n',
                  '                "prompt_digest": digest,\n                "job_id": job_id,\n',
                  2,
              ),
              (
                  '                        "prompt_digest": digest,\n            "job_id": job_id,\n',
                  '                        "prompt_digest": digest,\n                        "job_id": job_id,\n',
                  1,
              ),
              (
                  '        "prompt_digest": digest,\n            "job_id": job_id,\n        "schedule_mode": schedule_mode,\n',
                  '        "prompt_digest": digest,\n        "job_id": job_id,\n        "schedule_mode": schedule_mode,\n',
                  1,
              ),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"expected {expected} matches, found {count}: {old!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit formatting normalization
        run: |
          git diff --check
          python -m compileall -q automation/core.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/core.py
          git commit -m "style: normalize scheduler job id fields"
          git push origin HEAD:fix/issue-2-job-id-correlation
